services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    #environment:
     # MONGO_INITDB_ROOT_USERNAME: root
     # MONGO_INITDB_ROOT_PASSWORD: changeme}
    ports:
      - "127.0.0.1:27017:27017"   # optional: lets Compass/tools on your machine connect
    volumes:
      - mongo-data:/data/db
    networks:
      - mongo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-compass:
    image: haohanyang/compass-web
    container_name: compassweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - CW_MONGO_URI=mongodb://mongo:27017
      - CW_ENABLE_SHELL=true  
    networks:
      - mongo-net
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:

networks:
  mongo-net:
    name: mongo-net      # fixed name so other compose projects can join it
    driver: bridge